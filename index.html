<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Voyage Chine — Pouch</title>
  <meta name="description" content="Organise ton voyage en Chine : itinéraire, rendez-vous fournisseurs pour la marque Pouch, et tourisme." />
  <meta name="theme-color" content="#c8282e" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23c8282e%22/><text x=%2250%22 y=%2266%22 font-size=%2258%22 text-anchor=%22middle%22 fill=%22%23e0a93e%22>孙</text></svg>" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23c8282e%22/><text x=%2250%22 y=%2266%22 font-size=%2258%22 text-anchor=%22middle%22 fill=%22%23e0a93e%22>孙</text></svg>" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <header class="app-header">
    <div class="app-header-row">
      <div class="app-title">
        <h1>🇨🇳 Voyage Chine</h1>
        <span class="brand-chip">Pouch</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="settings-btn" aria-label="Réglages">⚙️</button>
      </div>
    </div>
  </header>

  <nav class="tabbar">
    <button class="tab-btn active" data-tab="dashboard">🏠 Accueil</button>
    <button class="tab-btn" data-tab="itinerary">🗺️ Itinéraire</button>
    <button class="tab-btn" data-tab="suppliers">🤝 Fournisseurs</button>
    <button class="tab-btn" data-tab="tourism">⛩️ Tourisme</button>
    <button class="tab-btn" data-tab="checklist">✅ Checklist</button>
  </nav>

  <main id="app">
    <section class="view active" id="view-dashboard"></section>
    <section class="view" id="view-itinerary"></section>
    <section class="view" id="view-suppliers"></section>
    <section class="view" id="view-tourism"></section>
    <section class="view" id="view-checklist"></section>
  </main>

  <button class="fab" id="fab" aria-label="Ajouter">+</button>

  <div class="modal-overlay" id="modal-overlay" hidden>
    <div class="modal-sheet" id="modal-sheet"></div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>China 🇨🇳 — Pouch</title>
  <meta name="description" content="Organise ton voyage en Chine : itinéraire, rendez-vous fournisseurs pour la marque Pouch, et tourisme." />
  <meta name="theme-color" content="#3a2e22" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%233a2e22%22/><text x=%2250%22 y=%2266%22 font-size=%2258%22 text-anchor=%22middle%22 fill=%22%23fdfaf5%22>孙</text></svg>" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%233a2e22%22/><text x=%2250%22 y=%2266%22 font-size=%2258%22 text-anchor=%22middle%22 fill=%22%23fdfaf5%22>孙</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Quicksand:wght@500;600;700&display=swap" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <header class="app-header">
    <div class="app-header-row">
      <div class="app-title">
        <h1>China 🇨🇳</h1>
        <img class="brand-logo" src="./assets/pouch-logo.png" alt="Pouch" />
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="settings-btn" aria-label="Réglages">⚙️</button>
      </div>
    </div>
  </header>

  <nav class="tabbar">
    <button class="tab-btn active" data-tab="dashboard">🏠 Accueil</button>
    <button class="tab-btn" data-tab="itinerary">📅 Programme</button>
    <button class="tab-btn" data-tab="suppliers">🤝 Fournisseurs</button>
    <button class="tab-btn" data-tab="hotels">🏨 Hôtels</button>
    <button class="tab-btn" data-tab="tourism">⛩️ Tourisme</button>
    <button class="tab-btn" data-tab="checklist">✅ Checklist</button>
    <button class="tab-btn" data-tab="achats">🛍️ Achats</button>
  </nav>

  <main id="app">
    <noscript><div class="card" style="border-color:var(--danger);"><div class="card-title">⚠️ JavaScript désactivé</div><div class="card-notes">Cette page a besoin de JavaScript pour afficher son contenu. Active-le dans les réglages de ton navigateur.</div></div></noscript>
    <section class="view active" id="view-dashboard"></section>
    <section class="view" id="view-itinerary"></section>
    <section class="view" id="view-suppliers"></section>
    <section class="view" id="view-hotels"></section>
    <section class="view" id="view-tourism"></section>
    <section class="view" id="view-checklist"></section>
    <section class="view" id="view-achats"></section>
  </main>

  <button class="fab" id="fab" aria-label="Ajouter">+</button>

  <div class="modal-overlay" id="modal-overlay" hidden>
    <div class="modal-sheet" id="modal-sheet"></div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
